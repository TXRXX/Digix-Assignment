opencollection: 1.0.0

info:
  name: BookLibrary
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  variables:
    - name: BASEURL
      value: http://localhost:3030/api
    - name: TOKEN
      value: ""
    - name: BOOK_ID
      value: ""
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
