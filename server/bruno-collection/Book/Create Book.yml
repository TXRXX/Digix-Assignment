info:
  name: Create Book
  type: http
  seq: 1

http:
  method: POST
  url: "{{BASEURL}}/books"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "title": "BookA",
        "author": "John Doe",
        "description": "Lorem Ipsum"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
