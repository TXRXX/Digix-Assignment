info:
  name: Register
  type: http
  seq: 1

http:
  method: POST
  url: "{{BASEURL}}/users/register"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "John Doe",
        "username": "johndoe",
        "password": "password123"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
